site_name: Sawblade Wiki
site_url: https://sawblade-entertainment.github.io/SawbladeWiki/
repo_url: https://github.com/Sawblade-Entertainment/SawbladeWiki
theme:
  name: shadcn
  palette: dark
  features:
    - search
    - excalidraw
  icon: img/sawblade_entertainment_logo_icon.png
plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
extra_css:
  - stylesheets/extra.css
